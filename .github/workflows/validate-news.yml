name: Validate website and news

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website data and files
        run: node scripts/validate.mjs
      - name: Test publication sorting
        run: node scripts/test-publication-sorting.mjs
      - name: Classify pull-request scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-news-scope.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
