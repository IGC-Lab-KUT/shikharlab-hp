name: Refresh OpenAlex citations

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openalex-citation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPENALEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENALEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the OpenAlex API key
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo 'OPENALEX_API_KEY is not configured. Add it as a repository Actions secret.' >&2
            exit 1
          fi
      - name: Test matching and failure handling
        run: node scripts/test-openalex.mjs
      - name: Refresh citation data
        run: node scripts/update-openalex-citations.mjs
      - name: Validate generated data and website files
        run: node scripts/validate.mjs
      - name: Create or update citation refresh pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- data/openalex-citations.json; then
            echo 'OpenAlex citation data is already current.'
            exit 0
          fi

          branch='automation/openalex-citations'
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          gh auth setup-git
          git add data/openalex-citations.json
          git commit -m 'Refresh OpenAlex citation counts'
          git push --force origin "HEAD:refs/heads/$branch"

          existing_pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'Refresh OpenAlex citation counts' \
              --body 'Automated monthly refresh of verified OpenAlex citation counts. Unmatched and ambiguous publications remain displayed as — and require manual review.'
          else
            echo "Updated existing pull request #$existing_pr."
          fi
