<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shikhar Labの知的通信、無線ネットワーク、IoT、6Gシステムに関する研究業績です。">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="../LOGO.PNG" type="image/png">
  <title>業績 - Shikhar Lab</title>
  <link rel="stylesheet" href="../style.css?v=20261016.2">
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section>
      <h1 class="page-title">研究業績</h1>
      <form class="publication-filters" id="publication-filters" role="search">
        <label for="publication-search">
          業績を検索
          <input id="publication-search" type="search" placeholder="タイトル、著者、キーワード" autocomplete="off" aria-controls="publications-container">
        </label>
        <label for="publication-year-filter">
          発表年
          <select id="publication-year-filter" aria-controls="publications-container">
            <option value="">すべての年</option>
          </select>
        </label>
        <label for="publication-type-filter">
          業績種別
          <select id="publication-type-filter" aria-controls="publications-container">
            <option value="">すべての種別</option>
            <option value="journal">論文誌</option>
            <option value="conference">国際会議論文</option>
            <option value="bookChapter">書籍章</option>
          </select>
        </label>
        <label for="publication-sort">
          並び順
          <select id="publication-sort" aria-controls="publications-container">
            <option value="year-desc">発表年：新しい順</option>
            <option value="year-asc">発表年：古い順</option>
            <option value="citations-desc">被引用数：多い順</option>
            <option value="citations-asc">被引用数：少ない順</option>
          </select>
        </label>
        <button class="publication-filter-reset" id="publication-filter-reset" type="reset">リセット</button>
      </form>
      <p class="publication-filter-status" id="publication-filter-status" aria-live="polite"></p>
      <div id="publications-container"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../js/common.js?v=20261015.1"></script>
  <script src="../js/publications.js?v=20261016.3"></script>
</body>
</html>
