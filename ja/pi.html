<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="高知工科大学グローバル知的通信研究室の指導教員、SHIKHARの学術プロフィールです。">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="../LOGO.PNG" type="image/png">
  <title>指導教員 - Shikhar Lab</title>
  <link rel="stylesheet" href="../style.css?v=20261027.1">
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <div id="header-placeholder"></div>
  <main id="main-content">
    <h1 class="page-title">指導教員</h1>
    <section class="profile-hero" aria-labelledby="pi-name">
      <div class="profile-photo-wrap" id="pi-photo-wrap"></div>
      <div>
        <p class="eyebrow">グローバル知的通信研究室</p>
        <h2 id="pi-name"></h2>
        <p class="profile-appointment" id="pi-appointment"></p>
        <p id="pi-affiliation"></p>
        <p id="pi-biography"></p>
        <ul class="profile-link-list" id="pi-profile-links" aria-label="学術プロフィール"></ul>
      </div>
    </section>

    <div class="profile-layout">
      <div>
        <section aria-labelledby="education-heading">
          <h2 id="education-heading">学歴・学位</h2>
          <div class="timeline-list" id="pi-education"></div>
        </section>
        <section aria-labelledby="appointments-heading">
          <h2 id="appointments-heading">主な職歴</h2>
          <div class="timeline-list" id="pi-appointments"></div>
        </section>
        <section aria-labelledby="teaching-heading">
          <h2 id="teaching-heading">教育・研究指導</h2>
          <div id="pi-teaching"></div>
        </section>
        <section aria-labelledby="contributions-heading">
          <div class="section-heading-row">
            <h2 id="contributions-heading">主な研究成果</h2>
            <a href="publications.html">研究業績一覧</a>
          </div>
          <ul class="compact-publication-list" id="pi-contributions"></ul>
        </section>
        <section aria-labelledby="funding-heading">
          <h2 id="funding-heading">研究費・競争的資金</h2>
          <div class="funding-list" id="pi-funding"></div>
        </section>
        <section aria-labelledby="service-heading">
          <h2 id="service-heading">編集・学会活動</h2>
          <div class="service-list" id="pi-service"></div>
        </section>
      </div>
      <aside>
        <section aria-labelledby="interests-heading">
          <h2 id="interests-heading">研究関心</h2>
          <ul class="check-list" id="pi-interests"></ul>
        </section>
        <section aria-labelledby="awards-heading">
          <div class="section-heading-row">
            <h2 id="awards-heading">主な受賞歴</h2>
            <a href="../awards.html">受賞歴一覧</a>
          </div>
          <div class="mini-list" id="pi-awards"></div>
        </section>
        <section aria-labelledby="contact-heading">
          <h2 id="contact-heading">連絡先</h2>
          <p><strong>メール:</strong> <span id="pi-email"></span></p>
          <p><strong>研究室:</strong> <span id="pi-office"></span></p>
        </section>
      </aside>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="../js/common.js?v=20261015.1"></script>
  <script src="../js/pi.js?v=20261027.1"></script>
</body>
</html>
